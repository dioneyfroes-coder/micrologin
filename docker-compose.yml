# ====================================
# DOCKER COMPOSE - DESENVOLVIMENTO
# Authentication Microservice
# ====================================

services:
  # =====================================
  # APLICAÇÃO PRINCIPAL
  # =====================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: auth-service-dev
    # Portas do HOST vêm do .env (fonte da verdade). Se uma estiver em uso,
    # use scripts/next-port.sh para achar a próxima livre (+1).
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${DEBUG_PORT:-9229}:9229" # Debug port
    environment:
      # .env é a fonte da verdade; defaults abaixo são os seguros p/ Docker.
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000 # contrato interno (healthcheck + mapa do host)
      - SSL_ENABLED=${SSL_ENABLED:-false}
      # DENTRO do compose o mongo/redis são serviços da rede docker:
      # URI_MONGODB_DOCKER / REDIS_URL_DOCKER (ver .env.example).
      - URI_MONGODB=${URI_MONGODB_DOCKER:-mongodb://mongodb:27017/auth_dev}
      - REDIS_URL=${REDIS_URL_DOCKER:-redis://redis:6379/0}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-change-me-32-chars-minimum-012345}
      - JWT_EXPIRES=${JWT_EXPIRES:-24h}
      - SECURITY_DASHBOARD_TOKEN=${SECURITY_DASHBOARD_TOKEN:-}
      - RATE_LIMIT_IP_POINTS=${RATE_LIMIT_IP_POINTS:-1000}
      - RATE_LIMIT_LOGIN_POINTS=${RATE_LIMIT_LOGIN_POINTS:-100}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped
    # Limites de recursos (aplicados pelo Docker, mesmo fora de swarm)
    cpus: 2.0
    mem_limit: 512m
    # Logging rotativo para não encher o disco em dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # MONGODB
  # =====================================
  mongodb:
    image: mongo:7-jammy
    container_name: auth-mongodb-dev
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - auth-network
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # REDIS
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: auth-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - auth-network
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# =====================================
# VOLUMES
# =====================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# =====================================
# NETWORKS
# =====================================
networks:
  auth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16