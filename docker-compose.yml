# ====================================
# DOCKER COMPOSE - DESENVOLVIMENTO
# Authentication Microservice
# ====================================

services:
  # =====================================
  # APLICAÇÃO PRINCIPAL
  # =====================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: auth-service-dev
    # Portas do HOST vêm do .env (fonte da verdade). Se uma estiver em uso,
    # use scripts/next-port.sh para achar a próxima livre (+1).
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${DEBUG_PORT:-9229}:9229" # Debug port
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SSL_ENABLED=false
      - URI_MONGODB=mongodb://mongodb:27017/auth_dev
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - JWT_SECRET=dev-secret-${JWT_SECRET:-change-me-32-chars-minimum-012345}
      - JWT_EXPIRES=24h
      - RATE_LIMIT_IP_POINTS=1000
      - RATE_LIMIT_LOGIN_POINTS=100
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # MONGODB
  # =====================================
  mongodb:
    image: mongo:7-jammy
    container_name: auth-mongodb-dev
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # REDIS
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: auth-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# =====================================
# VOLUMES
# =====================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# =====================================
# NETWORKS
# =====================================
networks:
  auth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16