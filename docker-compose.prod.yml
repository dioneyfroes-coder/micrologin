# ====================================
# DOCKER COMPOSE - PRODUÇÃO
# Authentication Microservice
# ====================================
#
# Simplificado (igual ao dev, decidido na fase P3): removido o nginx
# (apontava para nginx/nginx-prod.conf e nginx/ssl inexistentes) e as 3
# instâncias hardcoded. MongoDB/Redis são serviços gerenciados/externos
# (Atlas, ElastiCache etc.) — configure as URLs no .env.prod.
#
# Uso:
#   IMAGE_REF=ghcr.io/dioneyfroes-coder/micrologin@sha256:... \
#     docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# O caminho oficial é scripts/remote-deploy.sh, que resolve a imagem, faz
# readiness, smoke test e rollback automático.
#
# Escala horizontal NÃO é suportada por este arquivo: `ports` com binding fixo
# reserva a porta no host, e uma segunda réplica não consegue reservá-la. Isso
# exige remover o binding fixo e deixar o proxy distribuir (Fase 7 do roadmap).
#
# Todas as variáveis da aplicação são injetadas via env_file (.env.prod),
# consumidas diretamente por src/interfaces/config/*.ts.

services:
  auth-service:
    # IMAGE_REF é a referência imutável que o CI resolve (digest ou tag por
    # SHA) scripts/remote-deploy.sh. O fallback com REGISTRY/IMAGE_NAME/VERSION
    # existe para uso manual em desenvolvimento.
    image: ${IMAGE_REF:-${REGISTRY:-auth-service}/${IMAGE_NAME:-auth-service}:${VERSION:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      # Versão imutável em execução, para /observability e para identificar o
      # deploy em log (scripts/remote-deploy.sh exporta VERSION=sha256:...)
      VERSION: ${VERSION:-latest}
      # O container expõe a porta interna 3000; APP_PORT é o binding do host
      PORT: 3000
    # Porta do HOST vem do .env.prod (fonte da verdade). Se estiver em uso,
    # some +1 via scripts/next-port.sh --env .env.prod.
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - auth-network
    restart: unless-stopped
    # Limites de recursos (aplicados pelo Docker, mesmo fora de swarm)
    cpus: 2.0
    mem_limit: 512m
    # Readiness, e não /health: o health check completo responde 503 quando a
    # memória passa do limiar, o que marcaria o container como unhealthy sem
    # que ele tenha deixado de conseguir atender tráfego.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  auth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16