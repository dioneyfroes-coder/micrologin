# ====================================
# DOCKER COMPOSE - PRODUÇÃO
# Authentication Microservice
# ====================================
#
# Nginx é a única entrada publicada. A API fica apenas na rede interna de
# aplicação, permitindo réplicas com `docker compose up --scale auth-service=N`.
#
# MongoDB e Redis entram como serviço do proprio compose desde a Fase 1.3: sem
# `requirepass`/ACL e sem usuário de aplicação no Mongo, o conteúdo do banco
# (hashes de senha) e do cache (blacklist de JWT, contadores de rate limit)
# ficava legível por qualquer processo que alcançasse a rede do container. A
# alternativa gerenciada (Atlas, ElastiCache) continua valendo — apague os
# serviços `mongodb` e `redis` e aponte URI_MONGODB/REDIS_URL no host
# gerenciado, com TLS. O que não pode voltar é a conexão sem credencial: em
# produção o app recusa o arranque (decisão D18, docs/SEGURANCA.md).
#
# Uso:
#   scripts/generate-dependency-secrets.sh ./secrets/deps --for-container
#   IMAGE_REF=ghcr.io/dioneyfroes-coder/micrologin@sha256:... \
#     docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# O caminho oficial é scripts/remote-deploy.sh, que resolve a imagem, faz
# readiness, smoke test e rollback automático.
#
# Todas as variáveis da aplicação são injetadas via env_file (.env.prod),
# consumidas diretamente por src/interfaces/config/*.ts.

services:
  auth-service:
    # IMAGE_REF é a referência imutável que o CI resolve (digest ou tag por
    # SHA) scripts/remote-deploy.sh. O fallback com REGISTRY/IMAGE_NAME/VERSION
    # existe para uso manual em desenvolvimento.
    image: ${IMAGE_REF:-${REGISTRY:-auth-service}/${IMAGE_NAME:-auth-service}:${VERSION:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      # Versão imutável em execução, para /observability e para identificar o
      # deploy em log (scripts/remote-deploy.sh exporta VERSION=sha256:...)
      VERSION: ${VERSION:-latest}
      # Sobrescrevível pelo orquestrador; vazio usa o hostname único do container.
      INSTANCE_ID: ${INSTANCE_ID:-}
      # O container expõe a porta interna 3000; APP_PORT é o binding do host
      PORT: 3000
      # --- Teto de heap por processo (Fase 3.2, medido em docs/metricas.md) ---
      #
      # O valor NAO e um palpite: e o que a medicao de 400 VUs supports, com
      # folga explicita sobre o conjunto vivo e dentro do teto de 1 GiB do
      # container. Sem esta linha o Node escolhe sozinho (524 MB no Node 22
      # sob este cgroup), e essa escolha e heuristica do V8, nao um contrato:
      # ela muda de versao para versao e sobe junto com o limite do container.
      # Fixada, a memoria do processo passa a ter dono declarado -- e o modo de
      # falha tambem: com teto, o estouro vira `ERR_heap_out_of_memory` do Node
      # (log que diz o que aconteceu); sem teto, vira o OOM killer do cgroup
      # matando o processo por SIGKILL, sem log nenhum em cima.
      #
      # O mesmo numero esta em `ecosystem.config.cjs` (caminho PM2), e
      # `tests/unit/heap-budget-policy.test.ts` falha se os dois divergirem ou
      # se o teto cair abaixo do conjunto vivo medido.
      NODE_OPTIONS: "--max-old-space-size=512"
      # --- Assinatura ES256 ---
      # A chave privada entra como ARQUIVO montado (Docker secret / volume do
      # orquestrador), nunca como valor de ambiente: variável de ambiente vaza
      # em `docker inspect`, em dump de crash e em log de configuração.
      # Gere o par no diretorio do HOST com --for-container, que deixa o
      # material legivel pelo uid 1001 do nodeuser sem abrir o modo 600:
      #   scripts/generate-jwt-keys.sh <JWT_ES256_KEYS_DIR> <kid> --for-container
      JWT_ES256_PRIVATE_KEY_PATH: /run/secrets/jwt-es256-private.pem
      JWT_ES256_PUBLIC_KEY_PATH: /run/secrets/jwt-es256-public.pem
      # --- Credenciais das dependências (Fase 1.3, D18) ---
      # Mesma razão da chave ES256, agora com mais a perder: a senha do Mongo
      # dá acesso aos hashes de senha, e a do Redis à blacklist de tokens.
      #   scripts/generate-dependency-secrets.sh <DEPENDENCY_SECRETS_DIR> --for-container
      MONGODB_PASSWORD_PATH: /run/secrets-deps/mongo-app-password
      REDIS_PASSWORD_PATH: /run/secrets-deps/redis-password
      # A decisão de transporte da D18 escrita em código: o app liga para as
      # dependências pela rede dedicada `deps-network`, que é `internal` (sem
      # gateway e sem rota para fora do host) e não publica porta nenhuma. TLS
      # aqui seria o mesmo dado em texto claro atravessando o loopback do host —
      # o que protege é o isolamento, não a criptografia. Ao apontar para um
      # serviço gerenciado, troque por MONGODB_TLS=true / REDIS_TLS=true, que é
      # a outra metade da decisão.
      DEPENDENCY_NETWORK_ISOLATED: "true"
      # --- Disjuntor de requisições em andamento ---
      # Teto de requisições simultâneas POR PROCESSO. Vem do .env.prod (fonte
      # da verdade) com o mesmo valor default do código (1024), para que subir o
      # limite não exija editar imagem.
      MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-1024}
      # Nginx sobrescreve X-Forwarded-For com o IP do peer real; só ele está
      # conectado à rede de aplicação além das réplicas.
      TRUST_PROXY: "1"
    volumes:
      # Chave de assinatura: somente leitura. O diretório do host vem do
      # .env.prod (JWT_ES256_KEYS_DIR), de um secret do Docker ou de um volume
      # com saída do KMS.
      - type: bind
        source: ${JWT_ES256_KEYS_DIR:-./secrets}
        target: /run/secrets
        read_only: true
      # Senhas de Mongo e Redis. O app lê a senha do Mongo e a do Redis; a
      # senha do root do Mongo e o arquivo de ACL NÃO são legíveis por este
      # container (dono 999, modo 600) — o uid 1001 não os abre. É a diferença
      # entre o serviço ter acesso aos dados e ter acesso à administração deles.
      # `/run/secrets-deps`, e não `/run/secrets/deps`: o mount de /run/secrets é
      # somente-leitura, e um mountpoint filho não pode ser criado dentro dele —
      # o runc falha com "make mountpoint /run/secrets/deps: read-only file
      # system" e o container nunca sobe. Mount irmão, sem aninhamento.
      - type: bind
        source: ${DEPENDENCY_SECRETS_DIR:-./secrets/deps}
        target: /run/secrets-deps
        read_only: true
    expose:
      - "3000"
    networks:
      - auth-network
      - deps-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Limites de recursos (aplicados pelo Docker, mesmo fora de swarm)
    cpus: 2.0
    # 1 GiB, medido contra o host real (server01: i5-7200U, 4 vCPU, 12 GB).
    # Subir de 512m não muda o custo do hash — o gargalo é CPU, medido em
    # docs/metricas.md — mas dá folga para o pico de 4 logins simultâneos e
    # para a folga de framework que o /health mede.
    mem_limit: 1g
    sysctls:
      net.core.somaxconn: ${NET_CORE_SOMAXCONN:-4096}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    # Readiness, e não /health: o health check completo responde 503 quando a
    # memória passa do limiar, o que marcaria o container como unhealthy sem
    # que ele tenha deixado de conseguir atender tráfego.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-proxy:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/nginx-prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${PROXY_TLS_CERT_DIR:-./secrets/tls}
        target: /etc/nginx/tls
        read_only: true
    networks:
      - auth-network
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    sysctls:
      net.core.somaxconn: ${NET_CORE_SOMAXCONN:-4096}
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:7-jammy
    # O root e a senha da aplicação entram por ARQUIVO (`_FILE`), nunca por
    # variável: o entrypoint do Mongo le o valor de um arquivo e o exporta só
    # dentro do container, sem passar por `docker inspect`.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets-deps/mongo-root-password
      # O init script cria o usuário da aplicação com `readWrite` apenas sobre o
      # banco do serviço, em authSource=admin (docker/mongo/10-app-user.sh).
      MONGO_APP_USER: ${MONGO_APP_USER:-auth-service}
      MONGO_APP_DB: ${MONGO_APP_DB:-auth_prod}
      MONGO_APP_PASSWORD_PATH: /run/secrets-deps/mongo-app-password
    volumes:
      - mongo-data:/data/db
      # `/run/secrets-deps`, e não `/run/secrets/deps`: o mount de /run/secrets é
      # somente-leitura, e um mountpoint filho não pode ser criado dentro dele —
      # o runc falha com "make mountpoint /run/secrets/deps: read-only file
      # system" e o container nunca sobe. Mount irmão, sem aninhamento.
      - type: bind
        source: ${DEPENDENCY_SECRETS_DIR:-./secrets/deps}
        target: /run/secrets-deps
        read_only: true
      - type: bind
        source: ./docker/mongo/10-app-user.sh
        target: /docker-entrypoint-initdb.d/10-app-user.sh
        read_only: true
    # Sem `ports`: o banco não é publicado no host. Quem precisa falar com ele
    # está na deps-network; um `mongo` aberto em 0.0.0.0 seria alcançável por
    # qualquer coisa que o host aceite na interface.
    networks:
      - deps-network
    restart: unless-stopped
    mem_limit: 1g
    # Health check com o usuário da aplicação, não com o root: um health check
    # que autentica como root é uma credencial administrativa em mais um lugar.
    # `ping` é aceito para qualquer usuário autenticado, então a prova continua
    # valendo sem privilégio de admin.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_APP_USER\" --password \"$$(cat $$MONGO_APP_PASSWORD_PATH)\" --authenticationDatabase admin --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    # A ACL vem de arquivo (`--aclfile`), com `user default off` e o usuário da
    # aplicação com `+@all -@admin -@dangerous`. `requirepass` na linha de
    # comando colocaria a senha no `docker inspect` e em `ps`, e ligaria a senha
    # no usuário `default`, que não é atribuível a ninguém e não gira sem derrubar
    # quem está conectado.
    #
    # Persistência explícita (Fase 2.2). A blacklist de revogação, a versão de
    # sessão e o carimbo `user_tokens_revoked` NÃO são reconstruíveis: um restart
    # do container que os apaga devolve tokens revogados à validade até o
    # expirar, e o fail-closed (`SESSION_FAIL_OPEN`) não cobre esse caso, porque o
    # Redis está de pé e respondendo. AOF `everysec` dá RPO de ~1s para a
    # revogação e o snapshot RDB de 60s é a rede de segurança caso o AOF se
    # corrompa; sem eles a decisão implícita era "revogação vale até o token
    # expirar" (docs/REDIS.md, decisão D22).
    command: >-
      redis-server --aclfile /etc/redis/users.acl
      --appendonly yes --appendfsync everysec
      --save 60 1
    volumes:
      - redis_data:/data
      - type: bind
        source: ${DEPENDENCY_SECRETS_DIR:-./secrets/deps}/redis-app.acl
        target: /etc/redis/users.acl
        read_only: true
      # A senha em texto claro entra só para o health check. O arquivo de ACL,
      # que é o que o servidor usa para autenticar, guarda o hash; o texto claro
      # é do cliente que precisa provar a senha.
      - type: bind
        source: ${DEPENDENCY_SECRETS_DIR:-./secrets/deps}/redis-password
        target: /run/secrets/redis-password
        read_only: true
    networks:
      - deps-network
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis-password)\" redis-cli --no-auth-warning --user auth-service ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  auth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  # Rede dedicada das dependências: `internal` corta o gateway e a rota de saída,
  # então Mongo e Redis não alcançam a internet e nada fora do host os alcança.
  # É a segunda metade da decisão D18 — a outra metade é TLS no caminho, para o
  # caso de serviço gerenciado, que fica fora deste arquivo.
  deps-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  mongo-data:
    driver: local
  # Estado de revogação (blacklist, versão de sessão) e rate limit. Um volume
  # nomeado, não o diretório efêmero do container: o restart tem de devolver os
  # tokens revogados como revogados (docs/REDIS.md).
  redis_data:
    driver: local
