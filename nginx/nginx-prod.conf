worker_processes 1;
worker_rlimit_nofile 4096;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  access_log /dev/stdout;

  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream auth_backend {
    zone auth_backend 64k;
    least_conn;
    server auth-service:3000 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 100k;

    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 100k;
    keepalive_timeout 10s;
    send_timeout 30s;

    location ~ ^/(liveness|readiness)$ {
      proxy_pass http://auth_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_send_timeout 10s;
      proxy_read_timeout 35s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    location / {
      limit_req zone=per_ip burst=40 nodelay;
      limit_conn per_ip_conn 40;
      proxy_pass http://auth_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_send_timeout 10s;
      proxy_read_timeout 35s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}