name: 🎉 Release Pipeline

# A tag é a fonte de verdade. O caminho oficial é `git tag` + push da tag; o
# dispatch existe para reexecutar uma release de uma tag **já criada**, nunca
# para inventar versão. No dispatch, `github.ref_name` é o branch, não a versão —
# usar `github.ref_name` como `tag_name` era o bug que criava uma release
# "Release main".
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já criada e publicada (ex.: v1.0.0). O dispatch não cria tag.'
        required: true
        type: string

# Duas releases não podem correr ao mesmo tempo: ambas escrevem tag de imagem e
# GitHub Release. Sem isto, um retry do dispatch racing com o push da tag
# seguinte produz duas releases para a mesma versão.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================
  # VALIDAÇÃO DA TAG
  # ========================
  validate:
    name: 🏷️ Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      previous-tag: ${{ steps.resolve.outputs.previous }}
      is-prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Resolve and validate tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        # Tudo numa única etapa de propósito: cada `run:` é um shell novo, e
        # variável de shell não atravessa a fronteira entre steps. A versão
        # anterior da tag anterior vivia num step seguinte que usava `$TAG` sem
        # defini-lo no `env:` — os testes passavam porque injetavam `TAG` na
        # mão, e no GitHub real o `set -u` matava o job.
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$PUSH_TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Nenhuma tag informada. Use o input 'tag' com uma tag já publicada."
            exit 1
          fi

          # Semver estrito: v1.2.3, v1.2.3-rc.1, v1.2.3+build.5
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' não é semantic version válida (esperado vMAJOR.MINOR.PATCH)."
            exit 1
          fi

          # A tag precisa existir de fato. No dispatch, isso é o que garante que
          # ninguém está requesting release de versão que nunca foi criada.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' não existe no repositório. Crie e envie a tag antes."
            exit 1
          fi

          # No dispatch o checkout traz o branch, não a tag. Trocar aqui, antes
          # de ler o package.json, é o que faz a checagem de versão validar a
          # árvore da tag: ler antes devolveria a versão do branch.
          git checkout --quiet "$TAG"

          # package.json é a segunda fonte de verdade; as duas têm que concordar.
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::Tag '$TAG' (versão ${TAG#v}) não bate com package.json ($PKG)."
            echo "::error::A tag e o package.json são duas fontes de verdade para a mesma versão."
            exit 1
          fi

          # Release a partir de branch que não foi mergeada é exatamente o tipo de
          # release que não se quer descobrir depois.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::A tag '$TAG' aponta para commit que não está na main. Release só a partir de main."
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s' "$TAG" | grep -q -- '-'; then
            IS_PRERELEASE=true
          fi

          # `git describe --tags --abbrev=0 HEAD` devolveria a própria tag da
          # release, porque HEAD é a tag — o range viraria vazio e o changelog
          # sairia em branco. O `^` aponta para o commit pai, que é onde a tag
          # anterior vive.
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREV:-<primeira versão deste repositório>}" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Tag '$TAG' válida (versão ${TAG#v}, prerelease=$IS_PRERELEASE, anterior=${PREV:-nenhuma})"

          # SHA real do commit que a tag aponta (não é `github.sha` no dispatch)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ========================
  # GATES DE QUALIDADE E SEGURANÇA
  # ========================
  quality:
    name: 🔍 Quality & Dependency Gates
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout the tagged tree
        uses: actions/checkout@v4
        with:
          # Gates rodam sobre a tag validada, não sobre o ref do evento: no
          # dispatch o ref é o branch escolhido na UI, e um gate verde ali não
          # diz nada sobre a versão que está sendo publicada.
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Set up test environment
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-release-pipeline-secret-nao-e-real-32" >> $GITHUB_ENV
          echo "JWT_EXPIRES=1h" >> $GITHUB_ENV

      - name: 🎨 ESLint
        run: npm run lint

      - name: 🧪 TypeScript typecheck
        run: npm run typecheck

      - name: 🏗️ Build
        run: npm run build

      # O gate de dependências é o `audit-ci`, e só ele. Havia também um
      # `npm audit --audit-level=moderate` aqui, que nunca podia passar: o
      # `npm audit` não tem mecanismo de exceção, e a única advisory
      # `moderate+` da árvore (GHSA-vfj7-8cjw-p6xm, `braces`) está allowlisted
      # com validade até 2027-01-01 e justificativa no `.audit-ci.json`. Como o
      # `quality` é pré-requisito de `image` e de `release`, aquele step
      # transformava "exceção documentada" em "release que nunca publica" — e
      # só depois da tag já reescrita. O `audit-ci` cobre o mesmoThreshold
      # (`moderate: true`) com a exceção, e é ele que decide.
      - name: 📊 audit-ci (gate de dependências)
        run: npx audit-ci --config .audit-ci.json

      - name: 🔑 Secret scanning
        run: npm run test:secrets

  tests:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: 📥 Checkout the tagged tree
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup test environment
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-release-pipeline-secret-nao-e-real-32" >> $GITHUB_ENV
          echo "JWT_EXPIRES=1h" >> $GITHUB_ENV

      - name: 🧪 Run test suite
        run: |
          npm run test:unit:fast
          npm run test:credential-theft:unit

          # NÃO é um gate de resiliência a DDoS, e não deve ser lido como um.
          # `--preflight-only` retorna em `scripts/ddos-survival-test.mjs`
          # ANTES de checar Docker, k6, bash e openssl: ele só resolve e imprime
          # a URL alvo, e passa com ou sem k6 instalado. A suíte real sobe um
          # stack efêmero, roda k6 e exige um host provisionado — fora do escopo
          # de um runner do GitHub Actions.
          #
          # A escolha é deliberada: `test:ddos` falhou 1 vez em 7 execuções
          # (99.69%, 10 checks) e passou nas 6 seguintes. Como gate de release,
          # ele trocaria "release nunca publicada" por "release falha 1 em 7
          # vezes". A resiliência a DDoS é verificada no drill local e medida
          # no relatório de release, não neste job. O que este step garante é o
          # mais fraco que dá para garantir aqui: que o alvo do k6 resolve.
          npm run test:ddos -- --preflight-only

          npm run test:integration:app

  # ========================
  # IMAGEM
  # ========================
  image:
    name: 🐳 Build & Publish Candidate Image
    runs-on: ubuntu-latest
    needs: [validate, quality, tests]
    permissions:
      contents: read
      packages: write
    # Output do job é o que o `security` e o `release` consomem. Sem isto o
    # `steps.build.outputs.digest` morre no fim do step e
    # `needs.image.outputs.digest` chega vazio lá embaixo — o Trivy estaria
    # escaneando `repo@` e o resumo da release mostraria digest em branco.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.build.outputs.image }}
      candidate: ${{ steps.build.outputs.candidate }}

    steps:
      - name: 📥 Checkout the tagged tree
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push candidate image
        id: build
        env:
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          # Aqui publica-se **só** a tag candidata. As tags oficiais (versão, tag,
          # SHA, `latest`) só nascem no job `promote`, depois que o Trivy aprova o
          # digest. Antes desta correção o build empurrava as quatro de uma vez, e
          # um Trivy reprovado deixava `latest` apontando para a imagem rejeitada.
          CANDIDATE="${IMAGE}:candidate-${SHA}"

          # Um `--tag` por referência. Juntar as tags numa string com vírgula
          # (como a versão anterior fazia) derruba o `buildx` com
          # `invalid tag "a:1,b:2": invalid reference format` antes de tocar no
          # registry — foi a falha do Release 1.0.0 no job `image`.
          #
          # Só `linux/amd64`. O arm64 saiu por decisão, e o motivo é o caminho
          # crítico: um arm64 quebrado derrubaria a release inteira — inclusive
          # para quem só puxa amd64. E não havia nada consumindo arm64: nenhum
          # compose pinando plataforma, nenhum alvo de deploy, nenhum host
          # configurado. Somando a isso, arm64 nunca foi verificado aqui (a
          # máquina não tem QEMU). Publicar plataforma sem consumidor e sem
          # verificação só compra um modo de falha. Quando alguém precisar de
          # arm64, ele entra como item próprio, com build próprio e verificação
          # própria.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --tag "${CANDIDATE}" \
            --push \
            .

          # `buildx build --push` de verdade. O workflow anterior imprimia
          # "✅ Docker images tagged" sem tocar em registry nenhum.
          DIGEST=$(docker buildx imagetools inspect "${CANDIDATE}" --format '{{ .Manifest.Digest }}')

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "### 🐳 Imagem candidata"
            echo ""
            echo "- registry: \`${REGISTRY}\`"
            echo "- candidata: \`${CANDIDATE}\`"
            echo "- platforms: \`linux/amd64\`"
            echo "- **digest**: \`${DIGEST}\`"
            echo ""
            echo "As tags oficiais são promovidas só após o security scan."
          } >> "$GITHUB_STEP_SUMMARY"

  # ========================
  # SCAN DA IMAGEM CANDIDATA
  # ========================
  security:
    name: 🛡️ Scan candidate image
    runs-on: ubuntu-latest
    needs: [validate, image]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 🔍 Trivy gate on the candidate digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan por digest: é a mesma imagem que a promoção vai etiquetar, não
          # uma tag que pode ter sido movida entre o build e o scan. As tags
          # oficiais ainda não existem neste ponto — é isto que garante que uma
          # imagem reprovada nunca vira `latest`.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          version: 'v0.75.0'

      - name: 📤 Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================
  # PROMOÇÃO DAS TAGS
  # ========================
  promote:
    name: 🏷️ Promote candidate to release tags
    runs-on: ubuntu-latest
    # Só depois do scan: a promoção é o que move `latest`, e move-lo antes do
    # gate é exatamente o defeito que este job fecha.
    needs: [validate, image, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Promote candidate to release tags
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is-prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          REFS=("${IMAGE}:${VERSION}" "${IMAGE}:${TAG}" "${IMAGE}:${SHA}")

          # `latest` é movido só em versão estável. Um RC que toma `latest` faz
          # consumidor pulling em `latest` receber pré-release.
          if [ "$IS_PRERELEASE" = "false" ]; then
            REFS+=("${IMAGE}:latest")
            echo "→ latest será promovido (versão estável)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "→ latest NÃO será promovido (prerelease)" >> "$GITHUB_STEP_SUMMARY"
          fi

          TAG_ARGS=()
          for ref in "${REFS[@]}"; do
            TAG_ARGS+=(--tag "$ref")
          done

          # `--prefer-index=false` preserva o manifesto de origem. Sem ele o
          # buildx embrulha a imagem single-platform num índice, e as tags
          # oficiais passariam a apontar para outro digest — não o que o Trivy
          # aprovou.
          docker buildx imagetools create --prefer-index=false "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}"

          # Prova de que cada tag aponta para o digest aprovado, e não para
          # outro artefato: é a diferença entre "promoveu" e "promoveu o certo".
          for ref in "${REFS[@]}"; do
            promoted=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            if [ "$promoted" != "$DIGEST" ]; then
              echo "::error::$ref aponta para $promoted, esperado $DIGEST"
              exit 1
            fi
          done

          {
            echo "### 🏷️ Tags promovidas"
            echo ""
            echo "- digest: \`${DIGEST}\`"
            for ref in "${REFS[@]}"; do
              echo "- \`${ref}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ========================
  # GITHUB RELEASE
  # ========================
  release:
    name: 🎉 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, image, security, promote]
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout the tagged tree
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: 📝 Generate changelog
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PREVIOUS: ${{ needs.validate.outputs.previous-tag }}
        run: |
          set -euo pipefail

          {
            echo "## 🚀 What's New"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS..$TAG"
            else
              echo "- Primeira versão publicada a partir deste repositório."
            fi
            echo ""
            echo "## 🔧 Technical Details"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Node.js: \`${NODE_VERSION}\`"
            echo "- Imagem: \`${REGISTRY}/${IMAGE_NAME}\`"
            echo "- Digest: \`${{ needs.image.outputs.digest }}\`"
          } > CHANGELOG.md

          # Determinismo: mesmo tag => mesmo arquivo. Por isso nada de
          # `generate_release_notes` — o GitHub anexa as notas automáticas ao
          # corpo e elas mudam entre execuções.
          test -s CHANGELOG.md || { echo "::error::CHANGELOG.md ficou vazio"; exit 1; }
          cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ needs.validate.outputs.is-prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Release summary
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo "### 🎉 Release $TAG"
            echo ""
            echo "- commit: \`${{ needs.validate.outputs.sha }}\`"
            echo "- tag: \`$TAG\`"
            echo "- digest: \`$DIGEST\`"
            echo "- release: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"