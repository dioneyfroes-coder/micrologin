name: 🚀 CI/CD Pipeline - Authentication Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  NODE_VERSION: '22.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================
  # ANÁLISE DE CÓDIGO
  # ========================
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Validate commit messages (commitlint)
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: 🕵️ Secret scanning (gitleaks + material versionado)
        # O mesmo comando da máquina de desenvolvimento. A versão anterior rodava
        # o gitleaks avulso aqui e em nenhum outro lugar, e foi por isso que a
        # allowlist desatualizada passou: um passo que só existe no CI não tem
        # ninguém rodando contra ele antes do push.
        run: npm run test:secrets

      - name: 🎨 ESLint check
        run: npx eslint src/ tests/ --format stylish

      - name: 🧪 TypeScript typecheck
        run: npm run typecheck

      - name: 🔒 Security audit
        run: npm audit --audit-level=moderate

      - name: 📊 Dependency check
        run: npx audit-ci --config .audit-ci.json

  # ========================
  # TESTES AUTOMATIZADOS
  # ========================
  tests:
    name: 🧪 Automated Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        test-type: [unit-fast, integration, e2e]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup test environment
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-ci-cd" >> $GITHUB_ENV
          echo "JWT_EXPIRES=1h" >> $GITHUB_ENV

      - name: 🧪 Run unit tests (fast)
        if: matrix.test-type == 'unit-fast'
        run: |
          npm run test:unit:fast
          npm run test:credential-theft:unit
          npm run test:ddos -- --preflight-only
          echo "✅ Unit tests completed successfully"

      - name: 🔗 Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          npm run test:integration:app
          echo "✅ Integration tests completed successfully"

      - name: 🧪 Run E2E tests (compose real)
        if: matrix.test-type == 'e2e'
        run: |
          npm run test:e2e
          npm run test:e2e:down
          echo "✅ E2E tests completed successfully"

      - name: 📊 Generate coverage report
        if: matrix.test-type == 'unit-fast'
        run: npm run test:coverage:fast

      - name: 📤 Upload coverage to Codecov
        if: matrix.test-type == 'unit-fast'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ========================
  # BUILD & DOCKER
  # ========================
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: tests
    outputs:
      # `image-url` nunca existiu como output do docker/build-push-action, então
      # o job de deploy recebia string vazia e imprimia um "deploy" sem imagem.
      # A referência imutável é montada aqui, a partir do digest real.
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================
  # SECURITY SCANNING
  # ========================
  security:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      # Upload de SARIF em evento `push` é rejeitado sem esta permissão.
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # A mesma referência que será implantada: o metadata-action publica a
          # tag `sha-<40 chars>`, então `:${{ github.sha }}` apontava para uma
          # imagem inexistente e o scan não cobria o que ia para produção.
          image-ref: ${{ needs.build.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'

          # Gate de verdade. `exit-code` não tem default no trivy-action: sem isto
          # o passo terminava em 0 com a SARIF preenchida de vulnerabilidades, e
          # o job `security` ficava verde mesmo com achados.
          exit-code: '1'

          # Política de imagem: HIGH e CRITICAL. Um pouco mais permissivo que o
          # threshold `moderate` do `audit-ci` (1.6), e a assimetria é deliberada:
          # o audit-ci governa dependências que o projeto escolhe e fixa em
          # lockfile; aqui o alvo é a imagem inteira, incluindo pacotes da base
          # que o projeto não controla, onde MEDIUM é ruído frequente. Nenhum dos
          # dois é mais forte sozinho, e juntos não deixam buraco: dependência da
          # aplicação continua coberta a partir de moderate.
          severity: 'HIGH,CRITICAL'

          # Bloquear por vulnerabilidade sem correção disponível não torna o
          # software mais seguro: torna o gate ignorável. O achado continua no
          # relatório SARIF; o que reprova é o que dá para corrigir.
          ignore-unfixed: true

          # `trivy-action@v0.36.0` embute o motor v0.70.0 por default. Deixar no
          # default significa que vulnerabilidade disclosed depois do v0.70.0 não
          # é detectada, e o gate passa em silêncio — o pior modo de falha para um
          # gate. O próprio action tem input `version`; usá-lo evita trazer outro
          # action para a cadeia de dependências.
          version: 'v0.75.0'

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        # `always()` é o que faz o relatório ser publicado justamente quando o
        # gate reprova. Sem isto, um gate vermelho custaria também a evidência.
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================
  # DEPLOY (real, via SSH)
  # ========================
  # O que este job faz de verdade:
  #   1. monta a referência imutável da imagem (digest vindo do build);
  #   2. copia os scripts de deploy para o servidor;
  #   3. roda scripts/remote-deploy.sh no servidor, que faz pull por digest,
  #      backup da versão em vigor, `docker compose up -d`, espera /readiness,
  #      roda smoke test funcional e reverte sozinho se algo falhar;
  #   4. publica a versão implantada no resumo do job.
  #
  # Só roda em `workflow_dispatch`: não existe servidor configurado neste
  # repositório, e um job que "deploya" com `echo` mentindo sobre o que fez é
  # pior do que nenhum job. Os secrets necessários estão em README (seção
  # Deployment).
  #
  # ## Por que NÃO existe matrix aqui
  #
  # Havia uma matrix fixa com os dois ambientes e um input `environment` que
  # ninguém lia. Escolher `staging` no dispatch rodava a matrix inteira: o job
  # de staging E o de production, o segundo com os secrets de production e no
  # `environment: production`. O input era decoração — a interface prometia uma
  # escolha que a execução ignorava, e o nome do job era a única pista de que
  # os dois ambientes tinham sido tocados.
  #
  # A matrix só faria sentido se o input fosse "ambiente **ou** ambos". Como o
  # input oferece `staging` e `production` e nada mais, ele é o ambiente: uma
  # execução toca exatamente um. Se algum dia precisar dos dois, isso vira um
  # input separado e explícito, não uma matrix reintroduzida ao lado do input
  # que já existe.
  deploy:
    name: 🚀 Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'workflow_dispatch'
    # `environment` do GitHub: os secrets de ambiente e as regras de proteção
    # (required reviewers, espera, allowed branches) ficam vinculados a este
    # valor, e é o que impede o job de production de rodar sem aprovação.
    environment: ${{ inputs.environment }}
    env:
      # Prefixo dos secrets de repositório deste ambiente. Derivado do input, e
      # não de uma lista: não existe caminho no qual o prefixo resolvedo seja
      # outro além do ambiente escolhido. `env` de job não aceita o contexto
      # `env` na própria definição, mas aceita `inputs` — por isso a conversão
      # acontece aqui e as referências de secret usam `env.DEPLOY_SECRET_PREFIX`.
      DEPLOY_SECRET_PREFIX: ${{ inputs.environment == 'production' && 'PRODUCTION' || 'STAGING' }}
    concurrency:
      # Serializa por ambiente. Deploy em staging e em production são hosts
      # diferentes e não devem se cancelar; dois deploys no mesmo host se
      # atropelariam.
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚦 Travar o deploy no ambiente escolhido
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          RESOLVED_PREFIX: ${{ env.DEPLOY_SECRET_PREFIX }}
        run: |
          # Primeira barreira, e a mais barata: se o prefixo resolvido não for
          # exatamente o do ambiente escolhido, o job para aqui — antes de
          # qualquer rede, chave ou registry. Um dispatch com valor inesperado
          # (input editado à mão, workflow chamado por outra automação) não
          # chega a resolver host nem usuário de nenhum ambiente.
          EXPECTED="${INPUT_ENVIRONMENT^^}"
          if [ "$RESOLVED_PREFIX" != "$EXPECTED" ]; then
            echo "::error::Ambiente escolhido é '$INPUT_ENVIRONMENT' (esperado prefixo de secrets '$EXPECTED'), mas o job resolveu '$RESOLVED_PREFIX'."
            echo "Nenhum acesso a servidor foi feito. O deploy aborta por construção."
            exit 1
          fi
          if [ "$INPUT_ENVIRONMENT" != "staging" ] && [ "$INPUT_ENVIRONMENT" != "production" ]; then
            echo "::error::Ambiente '$INPUT_ENVIRONMENT' não é válido."
            exit 1
          fi
          echo "::notice::Deploy travado em '$INPUT_ENVIRONMENT' (secrets $RESOLVED_PREFIX_*)."
          echo "::notice::Nenhum outro ambiente é acessível nesta execução."

      - name: 🪪 Fail fast se o ambiente não estiver configurado
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', env.DEPLOY_SECRET_PREFIX)] }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Servidor de deploy não configurado para ${{ inputs.environment }}."
            echo "Defina o secret ${{ env.DEPLOY_SECRET_PREFIX }}_DEPLOY_HOST (e os demais da seção Deployment do README)."
            exit 1
          fi

      - name: 🔑 Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', env.DEPLOY_SECRET_PREFIX)] }}
          SSH_KNOWN_HOSTS: ${{ secrets[format('{0}_DEPLOY_KNOWN_HOSTS', env.DEPLOY_SECRET_PREFIX)] }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Chave do host conferida: o deploy não aceita falar com um host
            # que não esteja registrado.
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::${{ env.DEPLOY_SECRET_PREFIX }}_DEPLOY_KNOWN_HOSTS não definido: a chave do host será aceita na primeira conexão (TOFU)."
            printf '%s\n' '*' > ~/.ssh/known_hosts
          fi

      - name: 🔑 Autenticar no registry (quando a imagem é privada)
        env:
          REGISTRY_USERNAME: ${{ secrets[format('{0}_REGISTRY_USERNAME', env.DEPLOY_SECRET_PREFIX)] }}
          REGISTRY_TOKEN: ${{ secrets[format('{0}_REGISTRY_TOKEN', env.DEPLOY_SECRET_PREFIX)] }}
        run: |
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ]; then
            printf '%s' "$REGISTRY_TOKEN" | docker login "${{ env.REGISTRY }}" \
              --username "$REGISTRY_USERNAME" --password-stdin
            echo "::notice::Login no registry realizado."
          else
            echo "::notice::Sem credenciais de registry: a imagem precisa ser pública."
          fi

      - name: 📤 Enviar scripts de deploy para o servidor
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_USER: ${{ secrets[format('{0}_DEPLOY_USER', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_SSH_PORT: ${{ secrets[format('{0}_DEPLOY_SSH_PORT', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_SCRIPT_DIR: ${{ secrets[format('{0}_DEPLOY_SCRIPT_DIR', env.DEPLOY_SECRET_PREFIX)] }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          mkdir -p ~/.deploy
          scp -i ~/.ssh/deploy_key -P "$PORT" \
            scripts/remote-deploy.sh scripts/smoke-test.sh "$REMOTE:~/.deploy/"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$REMOTE" \
            "chmod +x ~/.deploy/remote-deploy.sh ~/.deploy/smoke-test.sh && echo 'scripts recebidos em ~/.deploy (dir configurada: ${DEPLOY_SCRIPT_DIR:-~/.deploy})'"

      - name: 🚀 Implantar a versão no servidor
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_USER: ${{ secrets[format('{0}_DEPLOY_USER', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_SSH_PORT: ${{ secrets[format('{0}_DEPLOY_SSH_PORT', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_ENV_FILE: ${{ secrets[format('{0}_DEPLOY_ENV_FILE', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_COMPOSE_FILE: ${{ secrets[format('{0}_DEPLOY_COMPOSE_FILE', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_BASE_URL: ${{ secrets[format('{0}_DEPLOY_BASE_URL', env.DEPLOY_SECRET_PREFIX)] }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          for name in DEPLOY_ENV_FILE DEPLOY_COMPOSE_FILE DEPLOY_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${{ env.DEPLOY_SECRET_PREFIX }}_${name} não configurado."
              exit 1
            fi
          done

          # O script sai != 0 quando o smoke falha (e reverte), quando o
          # readiness não vem, ou quando o resultado é inconclusivo. Nesse
          # caso o job fica vermelho - sem `|| echo "deploy concluído"`.
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$REMOTE" bash -s -- \
            "${{ needs.build.outputs.image-ref }}" \
            "$DEPLOY_ENV_FILE" "$DEPLOY_COMPOSE_FILE" "$DEPLOY_BASE_URL" \
            "${{ github.sha }}" "${{ github.actor }}" <<'REMOTE_SCRIPT'
          set -euo pipefail
          IMAGE_REF="$1"; ENV_FILE="$2"; COMPOSE_FILE="$3"; BASE_URL="$4"; COMMIT="$5"; ACTOR="$6"
          DEPLOY_COMMIT="$COMMIT" DEPLOYED_BY="$ACTOR" \
            ~/.deploy/remote-deploy.sh \
              --image "$IMAGE_REF" \
              --env-file "$ENV_FILE" \
              --compose-file "$COMPOSE_FILE" \
              --base-url "$BASE_URL"
          REMOTE_SCRIPT

      - name: 📋 Publicar a versão implantada
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_USER: ${{ secrets[format('{0}_DEPLOY_USER', env.DEPLOY_SECRET_PREFIX)] }}
          DEPLOY_SSH_PORT: ${{ secrets[format('{0}_DEPLOY_SSH_PORT', env.DEPLOY_SECRET_PREFIX)] }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          VERSION_JSON=$(ssh -i ~/.ssh/deploy_key -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cat /var/lib/micrologin/deployed-version 2>/dev/null || echo "{}"')
          echo "### Deploy ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$VERSION_JSON" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
