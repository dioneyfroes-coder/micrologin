name: 🚀 CI/CD Pipeline - Authentication Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  NODE_VERSION: '22.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================
  # ANÁLISE DE CÓDIGO
  # ========================
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Validate commit messages (commitlint)
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: 🕵️ Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$(pwd):/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.0 detect --source /repo --verbose

      - name: 🎨 ESLint check
        run: npx eslint src/ tests/ --format stylish

      - name: 🧪 TypeScript typecheck
        run: npm run typecheck

      - name: 🔒 Security audit
        run: npm audit --audit-level=high

      - name: 📊 Dependency check
        run: npx audit-ci --config .audit-ci.json

  # ========================
  # TESTES AUTOMATIZADOS
  # ========================
  tests:
    name: 🧪 Automated Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        test-type: [unit-fast, integration, e2e]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup test environment
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-ci-cd" >> $GITHUB_ENV
          echo "JWT_EXPIRES=1h" >> $GITHUB_ENV

      - name: 🧪 Run unit tests (fast)
        if: matrix.test-type == 'unit-fast'
        run: |
          npm run test:unit:fast
          echo "✅ Unit tests completed successfully"

      - name: 🔗 Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          npm run test:integration:app
          echo "✅ Integration tests completed successfully"

      - name: 🧪 Run E2E tests (compose real)
        if: matrix.test-type == 'e2e'
        run: |
          npm run test:e2e
          npm run test:e2e:down
          echo "✅ E2E tests completed successfully"

      - name: 📊 Generate coverage report
        if: matrix.test-type == 'unit-fast'
        run: npm run test:coverage:fast

      - name: 📤 Upload coverage to Codecov
        if: matrix.test-type == 'unit-fast'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ========================
  # BUILD & DOCKER
  # ========================
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: tests
    outputs:
      # `image-url` nunca existiu como output do docker/build-push-action, então
      # o job de deploy recebia string vazia e imprimia um "deploy" sem imagem.
      # A referência imutável é montada aqui, a partir do digest real.
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================
  # SECURITY SCANNING
  # ========================
  security:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          # A mesma referência que será implantada: o metadata-action publica a
          # tag `sha-<40 chars>`, então `:${{ github.sha }}` apontava para uma
          # imagem inexistente e o scan não cobria o que ia para produção.
          image-ref: ${{ needs.build.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================
  # DEPLOY (real, via SSH)
  # ========================
  # O que este job faz de verdade:
  #   1. monta a referência imutável da imagem (digest vindo do build);
  #   2. copia os scripts de deploy para o servidor;
  #   3. roda scripts/remote-deploy.sh no servidor, que faz pull por digest,
  #      backup da versão em vigor, `docker compose up -d`, espera /readiness,
  #      roda smoke test funcional e reverte sozinho se algo falhar;
  #   4. publica a versão implantada no resumo do job.
  #
  # Só roda em `workflow_dispatch`: não existe servidor configurado neste
  # repositório, e um job que "deploya" com `echo` mentindo sobre o que fez é
  # pior do que nenhum job. Os secrets necessários estão em README (seção
  # Deployment).
  deploy:
    name: 🚀 Deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ matrix.environment }}
    strategy:
      # Uma vez por ambiente: dois deploys simultâneos no mesmo host se atropelam.
      max-parallel: 1
      matrix:
        include:
          - environment: staging
            secret_prefix: STAGING
          - environment: production
            secret_prefix: PRODUCTION
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🪪 Fail fast se o ambiente não estiver configurado
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', matrix.secret_prefix)] }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Servidor de deploy não configurado para ${{ matrix.environment }}."
            echo "Defina o secret ${{ matrix.secret_prefix }}_DEPLOY_HOST (e os demais da seção Deployment do README)."
            exit 1
          fi

      - name: 🔑 Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', matrix.secret_prefix)] }}
          SSH_KNOWN_HOSTS: ${{ secrets[format('{0}_DEPLOY_KNOWN_HOSTS', matrix.secret_prefix)] }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Chave do host conferida: o deploy não aceita falar com um host
            # que não esteja registrado.
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::${{ matrix.secret_prefix }}_DEPLOY_KNOWN_HOSTS não definido: a chave do host será aceita na primeira conexão (TOFU)."
            printf '%s\n' '*' > ~/.ssh/known_hosts
          fi

      - name: 🔑 Autenticar no registry (quando a imagem é privada)
        env:
          REGISTRY_USERNAME: ${{ secrets[format('{0}_REGISTRY_USERNAME', matrix.secret_prefix)] }}
          REGISTRY_TOKEN: ${{ secrets[format('{0}_REGISTRY_TOKEN', matrix.secret_prefix)] }}
        run: |
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ]; then
            printf '%s' "$REGISTRY_TOKEN" | docker login "${{ env.REGISTRY }}" \
              --username "$REGISTRY_USERNAME" --password-stdin
            echo "::notice::Login no registry realizado."
          else
            echo "::notice::Sem credenciais de registry: a imagem precisa ser pública."
          fi

      - name: 📤 Enviar scripts de deploy para o servidor
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', matrix.secret_prefix)] }}
          DEPLOY_USER: ${{ secrets[format('{0}_DEPLOY_USER', matrix.secret_prefix)] }}
          DEPLOY_SSH_PORT: ${{ secrets[format('{0}_DEPLOY_SSH_PORT', matrix.secret_prefix)] }}
          DEPLOY_SCRIPT_DIR: ${{ secrets[format('{0}_DEPLOY_SCRIPT_DIR', matrix.secret_prefix)] }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          mkdir -p ~/.deploy
          scp -i ~/.ssh/deploy_key -P "$PORT" \
            scripts/remote-deploy.sh scripts/smoke-test.sh "$REMOTE:~/.deploy/"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$REMOTE" \
            "chmod +x ~/.deploy/remote-deploy.sh ~/.deploy/smoke-test.sh && echo 'scripts recebidos em ~/.deploy (dir configurada: ${DEPLOY_SCRIPT_DIR:-~/.deploy})'"

      - name: 🚀 Implantar a versão no servidor
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', matrix.secret_prefix)] }}
          DEPLOY_USER: ${{ secrets[format('{0}_DEPLOY_USER', matrix.secret_prefix)] }}
          DEPLOY_SSH_PORT: ${{ secrets[format('{0}_DEPLOY_SSH_PORT', matrix.secret_prefix)] }}
          DEPLOY_ENV_FILE: ${{ secrets[format('{0}_DEPLOY_ENV_FILE', matrix.secret_prefix)] }}
          DEPLOY_COMPOSE_FILE: ${{ secrets[format('{0}_DEPLOY_COMPOSE_FILE', matrix.secret_prefix)] }}
          DEPLOY_BASE_URL: ${{ secrets[format('{0}_DEPLOY_BASE_URL', matrix.secret_prefix)] }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          for name in DEPLOY_ENV_FILE DEPLOY_COMPOSE_FILE DEPLOY_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${{ matrix.secret_prefix }}_${name} não configurado."
              exit 1
            fi
          done

          # O script sai != 0 quando o smoke falha (e reverte), quando o
          # readiness não vem, ou quando o resultado é inconclusivo. Nesse
          # caso o job fica vermelho - sem `|| echo "deploy concluído"`.
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$REMOTE" bash -s -- \
            "${{ needs.build.outputs.image-ref }}" \
            "$DEPLOY_ENV_FILE" "$DEPLOY_COMPOSE_FILE" "$DEPLOY_BASE_URL" \
            "${{ github.sha }}" "${{ github.actor }}" <<'REMOTE_SCRIPT'
          set -euo pipefail
          IMAGE_REF="$1"; ENV_FILE="$2"; COMPOSE_FILE="$3"; BASE_URL="$4"; COMMIT="$5"; ACTOR="$6"
          DEPLOY_COMMIT="$COMMIT" DEPLOYED_BY="$ACTOR" \
            ~/.deploy/remote-deploy.sh \
              --image "$IMAGE_REF" \
              --env-file "$ENV_FILE" \
              --compose-file "$COMPOSE_FILE" \
              --base-url "$BASE_URL"
          REMOTE_SCRIPT

      - name: 📋 Publicar a versão implantada
        env:
          DEPLOY_HOST: ${{ secrets[format('{0}_DEPLOY_HOST', matrix.secret_prefix)] }}
          DEPLOY_USER: ${{ secrets[format('{0}_DEPLOY_USER', matrix.secret_prefix)] }}
          DEPLOY_SSH_PORT: ${{ secrets[format('{0}_DEPLOY_SSH_PORT', matrix.secret_prefix)] }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          VERSION_JSON=$(ssh -i ~/.ssh/deploy_key -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cat /var/lib/micrologin/deployed-version 2>/dev/null || echo "{}"')
          echo "### Deploy ${{ matrix.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$VERSION_JSON" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ========================
  # NOTIFICAÇÕES
  # ========================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
      - name: 📢 Notify deployment status
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          username: 'GitHub Actions'
          title: 'Authentication Service Deployment'
          text: |
            🚀 Deployment Status: ${{ job.status }}
            📦 Branch: ${{ github.ref_name }}
            👤 Author: ${{ github.actor }}
            🔗 Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
