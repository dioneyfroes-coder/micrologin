# ====================================
# STACK DE RESILIÊNCIA - testes de infraestrutura
# Authentication Microservice
# ====================================
#
# Stack separado, com nome, porta, rede e volumes próprios, usado só por
# `scripts/infra-resilience-test.sh`. Existe porque os dois testes que faltavam
# no roadmap (Fase 8) precisam derrubar serviço de verdade:
#
#   - reconexão do Redis: o teste unitário prova a estratégia, mas só um
#     Redis real parado e religado mostra que o processo volta a atender sem
#     ninguém reiniciá-lo;
#   - restart do container: só um container de verdade mostra que o shutdown
#     não fica pendurado no timer de reconexão e que o serviço volta a
#     autenticar depois.
#
# Por que não reusar o compose de dev: o teste precisa de `NODE_ENV=production`
# (é a política fail-closed que está em produção que importa), precisa poder
# parar o Redis sem derrubar o ambiente de quem está programando, e precisa
# poder reiniciar o container do app. Compartilhar stack com o dev tornaria cada
# um dos testes uma ação destrutiva sobre o ambiente do outro.
#
# Uso (o script cuida de build, env e teardown):
#   docker compose -p micrologin-resilience -f docker-compose.resilience.yml up -d
#
# As dependências exigem credencial, como em produção (Fase 1.3): o script
# gera Mongo e Redis autenticados em disco (RESILIENCE_DEPS_DIR) e apaga no
# teardown. Sem isso o stack validaria um caminho que não existe mais em
# produção — app conectando em banco aberto.
#
# A chave de assinatura ES256 é a exceção: o script a gera em disco
# (RESILIENCE_KEYS_DIR) e apaga no teardown, porque um par novo a cada rodada
# faria o token emitido antes do restart parecer inválido por motivo errado.

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ${RESILIENCE_IMAGE:-micrologin-resilience:local}
    container_name: ${RESILIENCE_APP_CONTAINER_NAME:-micrologin-resilience-app}
    environment:
      NODE_ENV: production
      PORT: 3000
      VERSION: resilience-test
      # Sem credencial na URI: ela vem por arquivo, e o app recusa as duas
      # formas ao mesmo tempo em vez de escolher uma em silêncio.
      URI_MONGODB: mongodb://mongodb:27017/auth_resilience
      MONGODB_USER: auth-service
      MONGODB_PASSWORD_PATH: /run/secrets/deps/mongo-app-password
      MONGODB_AUTH_SOURCE: admin
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: auth-service
      REDIS_PASSWORD_PATH: /run/secrets/deps/redis-password
      # Mongo e Redis não publicam porta e só existem nesta rede; é o transporte
      # que a validação de produção aceita no lugar de TLS.
      DEPENDENCY_NETWORK_ISOLATED: "true"
      # --- Assinatura ES256, como em produção ---
      # O stack de resiliência precisa exercitar o mesmo caminho de assinatura
      # que vai para produção: um teste que valida HS256 não diz nada sobre a
      # configuração que realmente roda.
      JWT_ALGORITHM: ES256
      # O `kid` vem do ambiente porque o script gera o par com esse mesmo nome
      # e depois afirma, no token real, que saiu a chave deste par. Hardcodar
      # aqui e no script daria uma asserção que passaria para qualquer chave.
      JWT_ES256_KID: ${RESILIENCE_JWT_KID:-resilience-v1}
      JWT_ES256_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-es256-private.pem
      JWT_ES256_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-es256-public.pem
      SECURITY_DASHBOARD_TOKEN: resilience-test-dashboard-token-22222
      # Sem certificado no stack de teste; o app só avisa no log.
      SSL_ENABLED: "false"
      CLUSTER_ENABLED: "false"
      TRUST_PROXY: ${RESILIENCE_TRUST_PROXY:-false}
      # Limite de login folgado: o teste faz logins em sequência e o limite de
      # produção (5 por 15min) transformaria uma assertiva sobre 503 em uma
      # falha de teste. O objetivo é que qualquer 429 observado aqui seja
      # realmente o bug (falha de infraestrutura tratada como abuso).
      RATE_LIMIT_PROD_LOGIN_POINTS: ${RESILIENCE_LOGIN_POINTS:-500}
      RATE_LIMIT_PROD_LOGIN_DURATION: "60"
      RATE_LIMIT_PROD_IP_POINTS: ${RESILIENCE_IP_POINTS:-500}
      LOG_LEVEL: info
    volumes:
      # Par ES256 gerado em disco pelo script, não em variável de ambiente: o
      # token emitido antes do restart do container precisa continuar
      # verificando depois dele, ou o teste mediria o motivo errado.
      - type: bind
        source: ${RESILIENCE_KEYS_DIR:-./.resilience-keys}
        target: /run/secrets/jwt
        read_only: true
      # Segredos das dependências, com o dono já ajustado pelo script para os
      # uids das imagens (o app roda como uid 1001).
      - type: bind
        source: ${RESILIENCE_DEPS_DIR:-./.resilience-deps}
        target: /run/secrets/deps
        read_only: true
    ports:
      - "127.0.0.1:${RESILIENCE_PORT:-3200}:3000"
    networks:
      - resilience-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readiness"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  mongodb:
    image: mongo:7-jammy
    container_name: ${RESILIENCE_MONGO_CONTAINER_NAME:-micrologin-resilience-mongo}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/deps/mongo-root-password
      MONGO_APP_USER: auth-service
      MONGO_APP_DB: auth_resilience
      MONGO_APP_PASSWORD_PATH: /run/secrets/deps/mongo-app-password
    volumes:
      - resilience-mongo:/data/db
      - type: bind
        source: ${RESILIENCE_DEPS_DIR:-./.resilience-deps}
        target: /run/secrets/deps
        read_only: true
      # Cria o usuário de menor privilégio no primeiro start do volume. É
      # source (`. "$f"`) pelo entrypoint, então precisa ser legível pelo uid
      # 999 que executa o Mongo.
      - type: bind
        source: ./docker/mongo/10-app-user.sh
        target: /docker-entrypoint-initdb.d/10-app-user.sh
        read_only: true
    networks:
      - resilience-network
    healthcheck:
      # Autentica como o usuário da aplicação: um ping anônimo passaria com o
      # banco aberto, e o teste deixaria de provar que a credencial é exigida.
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_APP_USER\" --password \"$$(cat $$MONGO_APP_PASSWORD_PATH)\" --authenticationDatabase admin --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ${RESILIENCE_REDIS_CONTAINER_NAME:-micrologin-resilience-redis}
    # Sem persistência: o teste reinicia o Redis de propósito e não quer que a
    # retomada dependa de dados sobreviventes. `--aclfile` com `user default
    # off` faz a conexão anônima ser recusada.
    command: redis-server --aclfile /etc/redis/users.acl --save "" --appendonly no
    volumes:
      - type: bind
        source: ${RESILIENCE_DEPS_DIR:-./.resilience-deps}/redis-app.acl
        target: /etc/redis/users.acl
        read_only: true
      # Texto claro da senha só para o health check provar a credencial; o
      # servidor autentica pelo hash que está no arquivo de ACL.
      - type: bind
        source: ${RESILIENCE_DEPS_DIR:-./.resilience-deps}/redis-password
        target: /run/secrets/redis-password
        read_only: true
    networks:
      - resilience-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis-password)\" redis-cli --no-auth-warning --user auth-service ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-proxy:
    profiles: [ddos]
    image: nginx:1.28-alpine
    container_name: ${RESILIENCE_PROXY_CONTAINER_NAME:-micrologin-resilience-proxy}
    ports:
      - "127.0.0.1:${DDOS_PROXY_HTTP_PORT:-3201}:80"
      - "127.0.0.1:${DDOS_PROXY_TLS_PORT:-3203}:443"
    volumes:
      - type: bind
        source: ./nginx/nginx-prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${RESILIENCE_TLS_DIR:-./.resilience-tls}
        target: /etc/nginx/tls
        read_only: true
    networks:
      - resilience-network
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

networks:
  resilience-network:
    driver: bridge

volumes:
  resilience-mongo:
    driver: local
